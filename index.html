<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>نتائج الشهادة الإعدادية والنقل - مدرسة الظواهرية</title>
    <meta property="og:title" content="نتائج امتحانات 2026 - مدرسة الظواهرية">
    <meta property="og:description" content="استعلم الآن عن نتيجة الشهادة الإعدادية وصفوف النقل بإدارة الحسينية التعليمية">
    <meta property="og:image" content="shool.jpg">

    <style>
        :root { --primary: #1a5fb4; --secondary: #27ae60; --dark: #1a1a1a; --gold: #d4af37; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; direction: rtl; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, var(--dark), #333); color: white; padding: 25px 10px; text-align: center; border-bottom: 4px solid var(--gold); }
        .header h1 { margin: 0; font-size: 22px; }
        .header h2 { margin: 5px 0 0; font-size: 16px; color: var(--gold); font-weight: normal; }
        
        .main-tabs { display: flex; max-width: 600px; margin: 20px auto 0; background: #e0e0e0; border-radius: 12px 12px 0 0; overflow: hidden; border: 1px solid #ccc; }
        .main-tab { flex: 1; padding: 15px 5px; cursor: pointer; text-align: center; font-weight: bold; transition: 0.3s; font-size: 14px; }
        .main-tab.active { background: white; color: var(--primary); border-top: 4px solid var(--primary); margin-top: -4px; }

        .card { max-width: 600px; margin: 0 auto 40px; background: white; padding: 25px; border-radius: 0 0 12px 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); text-align: center; border: 1px solid #eee; border-top: none; }
        #schoolSelector { margin-bottom: 20px; background: #f1f8f4; padding: 10px; border-radius: 10px; }
        .sub-btn { padding: 8px 15px; border: 2px solid #ccc; border-radius: 8px; cursor: pointer; margin: 5px; font-size: 13px; font-weight: bold; display: inline-block; background: white; }
        .sub-btn.active { background: var(--secondary); color: white; border-color: var(--secondary); }

        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; text-align: center; box-sizing: border-box; }
        button#searchBtn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
        
        #res { margin-top: 25px; display: none; text-align: right; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border-right: 5px solid var(--gold); margin-bottom: 15px; line-height: 1.6; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th { background: var(--primary); color: white; }
        .total-row { background: #fff9e6; font-weight: bold; color: #c0392b; }
        #loader { display: none; margin: 15px 0; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>إدارة الحسينية التعليمية</h1>
    <h2>مدرسة الظواهرية للتعليم الأساسي</h2>
</div>

<div class="main-tabs">
    <div id="tabSchool" class="main-tab active" onclick="switchMain('school')">صفوف النقل (المدرسة)</div>
    <div id="tabPrep" class="main-tab" onclick="switchMain('prep')">الشهادة الإعدادية (الإدارة)</div>
</div>

<div class="card">
    <div id="schoolSelector">
        <span id="subBtn1" class="sub-btn active" onclick="setSub(1, this)">الصف الأول</span>
        <span id="subBtn2" class="sub-btn" onclick="setSub(2, this)">الصف الثاني</span>
    </div>

    <input type="number" id="seatInput" placeholder="أدخل رقم الجلوس">
    <button id="searchBtn" onclick="getResults()">عرض النتيجة</button>
    
    <div id="loader">جاري جلب البيانات...</div>
    
    <div id="res">
        <div id="info" class="info-box"></div>
        <table>
            <thead><tr><th>المادة</th><th>الدرجة</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const links = {
        prep3: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSbnUGQbyb5wzO9niMAjbZL2ylT2c3BhOsM_FJfQQgDhM0qqi4E0fXswfZs5g9QWkGO7hdKXBt2PBvZ/pub?output=csv',
        prep2: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQh7eF7_FUOpgxYV21YDNQHIfyICTaqHSgh5amFkkXTpBmJdaoo-p31BuwmOzOHT7fJj8QFZVpJk8pe/pub?output=csv',
        prep1: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5D73qMZI-_z6xXKHlVD_JEgcdrp__GCy-zkXooalXq7YbiJTVCEjsLgt89q0L_A/pub?output=csv'
    };

    let currentMode = 'prep1'; 

    function switchMain(mode) {
        document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('res').style.display = 'none';
        if(mode === 'school') {
            document.getElementById('tabSchool').classList.add('active');
            document.getElementById('schoolSelector').style.display = 'block';
            setSub(1, document.getElementById('subBtn1'));
            document.getElementById('searchBtn').style.backgroundColor = '#27ae60';
        } else {
            document.getElementById('tabPrep').classList.add('active');
            document.getElementById('schoolSelector').style.display = 'none';
            currentMode = 'prep3';
            document.getElementById('searchBtn').style.backgroundColor = '#1a5fb4';
        }
    }

    function setSub(grade, el) {
        currentMode = 'prep' + grade;
        document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('res').style.display = 'none';
    }

    async function getResults() {
        const seat = document.getElementById('seatInput').value.trim();
        const resDiv = document.getElementById('res');
        const loader = document.getElementById('loader');
        
        if(!seat) { alert("أدخل رقم الجلوس أولاً"); return; }

        loader.style.display = "block";
        resDiv.style.display = "none";

        try {
            const response = await fetch(links[currentMode]);
            const text = await response.text();
            const rows = text.split(/\r?\n/).map(row => row.split(',').map(cell => cell.trim().replace(/^["']|["']$/g, '')));
            const headers = rows[0];
            
            let student = null;
            // البحث عن الطالب (رقم الجلوس في الشهادة عمود 0، وفي النقل عمود 2)
            let seatCol = (currentMode === 'prep3') ? 0 : 2;
            student = rows.find((r, index) => index > 0 && r[seatCol] === seat);

            loader.style.display = "none";

            if(student) {
                resDiv.style.display = "block";
                let html = "";
                
                // هنا حل مشكلة مادة العربي: للنقل يبدأ من عمود 3، للشهادة من عمود 4
                let startIndex = (currentMode === 'prep3') ? 4 : 3;

                for(let i = startIndex; i < headers.length; i++) {
                    if(headers[i]) {
                        let isTotal = headers[i].includes("مجموع");
                        html += `<tr class="${isTotal ? 'total-row' : ''}"><td><b>${headers[i]}</b></td><td>${student[i] || '0'}</td></tr>`;
                    }
                }
                
                let infoHtml = `<strong>الاسم:</strong> ${student[1]}<br>`;
                if(currentMode === 'prep3') infoHtml += `<strong>المدرسة:</strong> ${student[3] || 'غير متوفر'}<br>`;
                infoHtml += `<strong>رقم الجلوس:</strong> ${seat}`;
                
                document.getElementById('info').innerHTML = infoHtml;
                document.getElementById('tableBody').innerHTML = html;
            } else {
                alert("رقم الجلوس غير صحيح لهذا الصف.");
            }
        } catch(e) {
            loader.style.display = "none";
            alert("حدث خطأ في جلب البيانات.");
        }
    }
</script>
</body>
</html>
