<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الشهادة الإعدادية - إدارة الحسينية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; direction: rtl; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #1a5fb4, #111); color: white; padding: 30px 10px; text-align: center; border-bottom: 5px solid #d4af37; }
        .gift { color: #d4af37; font-weight: bold; margin-top: 10px; font-size: 18px; border: 1px dashed #d4af37; display: inline-block; padding: 8px 25px; border-radius: 50px; background: rgba(0,0,0,0.2); }
        .card { max-width: 500px; margin: -20px auto 40px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 15px; margin: 15px 0 20px; border: 2px solid #ddd; border-radius: 10px; font-size: 20px; text-align: center; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: 0.3s; }
        #res { margin-top: 25px; display: none; text-align: right; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border-right: 5px solid #d4af37; margin-bottom: 20px; font-size: 17px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th { background: #1a5fb4; color: white; }
        .fail-grade { color: #e74c3c; font-weight: bold; background-color: #fff5f5; }
        .total-row { background: #fff9e6; font-weight: bold; color: #c0392b; }
        .grade-badge { display: inline-block; padding: 4px 12px; border-radius: 4px; color: white; font-size: 14px; margin-top: 5px; }
        .excelent { background-color: #27ae60; } .very-good { background-color: #2980b9; } 
        .good { background-color: #f39c12; } .pass { background-color: #95a5a6; } .fail { background-color: #e74c3c; }
    </style>
</head>
<body>

<div class="header">
    <h1>بوابة نتائج الشهادة الإعدادية 2026</h1>
    <div class="gift">إهداء من مدرسة الظواهرية للتعليم الأساسي 🏆</div>
</div>

<div class="card">
    <input type="text" id="seatInput" placeholder="أدخل رقم الجلوس هنا">
    <button onclick="getResults()">عرض النتيجة الآن</button>
    <div id="res">
        <div id="info" class="info-box"></div>
        <table>
            <thead><tr><th>المادة</th><th>الدرجة</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const dataUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSbnUGQbyb5wzO9niMAjbZL2ylT2c3BhOsM_FJfQQgDhM0qqi4E0fXswfZs5g9QWkGO7hdKXBt2PBvZ/pub?output=csv';

    function checkFail(subject, score) {
        let val = parseFloat(score);
        if (isNaN(val)) return false;
        
        // فحص المواد حسب شروطك
        if (subject.includes("عربى") && val < 20) return true;
        if (subject.includes("انجليزى") && val < 15) return true;
        if (subject.includes("رياض") && val < 15) return true;
        if (subject.includes("علوم") && val < 10) return true;
        if (subject.includes("دراسات") && val < 10) return true;
        
        return false;
    }

    function calculateGrade(score) {
        let total = parseFloat(score);
        if (isNaN(total)) return { text: "", class: "" };
        let percentage = (total / 140) * 100; // تم التعديل لـ 140 درجة للترم الواحد
        if (percentage >= 85) return { text: "امتياز 🌟", class: "excelent" };
        if (percentage >= 75) return { text: "جيد جداً ✨", class: "very-good" };
        if (percentage >= 65) return { text: "جيد 👍", class: "good" };
        if (percentage >= 50) return { text: "مقبول 😅", class: "pass" };
        return { text: "دون المستوى ⚠️", class: "fail" };
    }

    async function getResults() {
        const seat = document.getElementById('seatInput').value.trim();
        const resDiv = document.getElementById('res');
        if(!seat) return alert("اكتب رقم الجلوس");

        try {
            const response = await fetch(dataUrl);
            const text = await response.text();
            const rows = text.split(/\r?\n/).map(row => row.split(',').map(cell => cell.trim().replace(/^["']|["']$/g, '')));
            const headers = rows[0];
            const student = rows.find(r => r[0] == seat || r.some(cell => cell == seat));

            if(student) {
                resDiv.style.display = "block";
                let html = "";
                for(let i = 4; i < headers.length; i++) {
                    if(headers[i]) {
                        let val = student[i] || '0';
                        let isRed = checkFail(headers[i], val);
                        let isTotal = headers[i].includes("مجموع");
                        
                        let tdClass = isRed ? 'class="fail-grade"' : '';
                        
                        if(isTotal) {
                            let g = calculateGrade(val);
                            html += `<tr class="total-row"><td>${headers[i]}</td><td>${val}<br><span class="grade-badge ${g.class}">${g.text}</span></td></tr>`;
                        } else {
                            html += `<tr><td>${headers[i]}</td><td ${tdClass}>${val}</td></tr>`;
                        }
                    }
                }
                document.getElementById('info').innerHTML = `<strong>الاسم:</strong> ${student[1]}<br><strong>المدرسة:</strong> ${student[3]}`;
                document.getElementById('tableBody').innerHTML = html;
            } else { alert("رقم الجلوس غير موجود"); }
        } catch(e) { alert("خطأ في الاتصال"); }
    }
</script>
</body>
</html>
