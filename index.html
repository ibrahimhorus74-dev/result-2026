<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الشهادة الإعدادية - الحسينية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; direction: rtl; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 30px 10px; text-align: center; border-bottom: 5px solid #d4af37; }
        .card { max-width: 500px; margin: -20px auto 40px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 20px; text-align: center; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
        #res { margin-top: 25px; display: none; text-align: right; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border-right: 5px solid #d4af37; margin-bottom: 20px; font-size: 18px; line-height: 1.6; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #1e3c72; color: white; }
        .loader { display: none; margin: 20px 0; color: #1e3c72; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>نتيجة الشهادة الإعدادية 2026</h1>
    <p>إدارة الحسينية التعليمية</p>
</div>

<div class="card">
    <input type="text" id="seatInput" placeholder="أدخل رقم الجلوس هنا">
    <button onclick="getResults()">بحث عن النتيجة</button>
    <div id="loader" class="loader">🔍 جاري فحص السجلات...</div>
    <div id="res">
        <div id="info" class="info-box"></div>
        <table>
            <thead><tr><th>المادة</th><th>الدرجة</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const csvLink = 'aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vc3ByZWFkc2hlZXRzL2QvZS8yUEFDWC0xdlNiblVHUWJ5YjV3ek85bmlNQWpiWkwyeWxUMmMzQmhPc01fRkpZUVFnRGhNMHFxaTRFMGZYc3dmWnM1ZzlRV2tHTzdoZEtYQnQyUEJ2Wi9wdWI/Z2lkPTAmc2luZ2xlPXRydWUmb3V0cHV0PWNzdi';

    async function getResults() {
        const seat = document.getElementById('seatInput').value.trim();
        const loader = document.getElementById('loader');
        const resDiv = document.getElementById('res');

        if(!seat) return alert("اكتب رقم الجلوس");
        loader.style.display = "block";
        resDiv.style.display = "none";

        try {
            const resp = await fetch(atob(csvLink));
            const text = await resp.text();
            
            // تقسيم السطور وتنظيفها تماماً من أي رموز غريبة
            const rows = text.split('\n').map(r => r.split(',').map(c => c.trim().replace(/[\u200B-\u200D\uFEFF]/g, "")));
            const headers = rows[0];

            // البحث: بنقارن رقم الجلوس المدخل بأي خلية في السطر (عشان لو فيه إزاحة أعمدة)
            // وبنشيل أي مسافات من الطرفين
            const student = rows.find(r => r[0] == seat || r[1] == seat);

            loader.style.display = "none";

            if(student) {
                resDiv.style.display = "block";
                document.getElementById('info').innerHTML = `
                    <strong>الاسم:</strong> ${student[1]}<br>
                    <strong>رقم الجلوس:</strong> ${student[0]}<br>
                    <strong>الإدارة:</strong> ${student[2]} | <strong>المدرسة:</strong> ${student[3]}
                `;
                
                let html = "";
                // الدرجات بتبدأ من العمود الخامس (عربي) index 4
                for(let i = 4; i < headers.length; i++) {
                    if(headers[i]) {
                        html += `<tr><td><b>${headers[i]}</b></td><td>${student[i] || '0'}</td></tr>`;
                    }
                }
                document.getElementById('tableBody').innerHTML = html;
            } else {
                alert("⚠️ لم نجد رقم الجلوس " + seat + " في الملف. تأكد من كتابته بشكل صحيح.");
            }
        } catch(e) {
            loader.style.display = "none";
            alert("❌ خطأ في الاتصال بالسيرفر.");
        }
    }
</script>
</body>
</html>
