<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج مدرسة الظواهرية - إدارة الحسينية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; direction: rtl; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 40px 10px; text-align: center; border-bottom: 5px solid #d4af37; }
        .gift { color: #d4af37; font-weight: bold; margin-top: 15px; font-size: 19px; border: 1px dashed #d4af37; display: inline-block; padding: 5px 20px; border-radius: 50px; }
        .card { max-width: 550px; margin: -25px auto 40px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; }
        input { width: 100%; padding: 15px; margin: 25px 0; border: 2px solid #eee; border-radius: 12px; font-size: 20px; text-align: center; box-sizing: border-box; }
        .search-btn { background: #27ae60; color: white; border: none; padding: 16px; border-radius: 12px; cursor: pointer; font-size: 19px; font-weight: bold; width: 100%; transition: 0.3s; }
        #res { margin-top: 30px; display: none; text-align: right; }
        .student-info { background: #f8f9fa; padding: 20px; border-radius: 15px; border-right: 8px solid #d4af37; margin-bottom: 25px; font-size: 19px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th, td { border: 1px solid #f0f0f0; padding: 14px; text-align: center; }
        th { background: #1e3c72; color: white; }
        .loader { display: none; color: #1a5fb4; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>نتائج امتحانات 2026 - بوابة مدرسة الظواهرية</h1>
        <div class="gift">إهداء لطلاب إدارة الحسينية التعليمية 🏆</div>
    </div>

    <div class="card">
        <p style="color: #666; font-weight: bold;">(بحث موحد لصفوف النقل والشهادة الإعدادية)</p>
        <input type="text" id="seatInput" placeholder="أدخل رقم الجلوس هنا">
        <button class="search-btn" onclick="getResults()">عرض النتيجة الآن</button>
        
        <div id="loader" class="loader">🔍 جاري سحب البيانات من السيرفر...</div>

        <div id="res">
            <div id="info" class="student-info"></div>
            <table>
                <thead><tr><th>المادة</th><th>الدرجة</th></tr></thead>
                <tbody id="tableData"></tbody>
            </table>
        </div>
    </div>

    <script>
        // الرابط الموحد للإدارة (تأكد إنه من نوع CSV)
        const csvLink = 'aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vc3ByZWFkc2hlZXRzL2QvZS8yUEFDWC0xdlNiblVHUWJ5YjV3ek85bmlNQWpiWkwyeWxUMmMzQmhPc01fRkpZUVFnRGhNMHFxaTRFMGZYc3dmWnM1ZzlRV2tHTzdoZEtYQnQyUEJ2Wi9wdWI/Z2lkPTAmc2luZ2xlPXRydWUmb3V0cHV0PWNzdi';

        async function getResults() {
            const seat = document.getElementById('seatInput').value.trim();
            const loader = document.getElementById('loader');
            const resDiv = document.getElementById('res');

            if(!seat) return alert("يرجى كتابة رقم الجلوس");

            loader.style.display = "block";
            resDiv.style.display = "none";

            try {
                const response = await fetch(atob(csvLink));
                const text = await response.text();
                
                // تنظيف الملف من أي رموز مخفية
                const cleanText = text.replace(/^\uFEFF/, "");
                const rows = cleanText.split('\n').filter(line => line.trim() !== "").map(r => r.split(',').map(cell => cell.trim()));
                const headers = rows[0];
                
                // البحث في أول عمود عن رقم الجلوس
                const student = rows.find(r => r[0] == seat);

                loader.style.display = "none";

                if(student) {
                    resDiv.style.display = "block";
                    document.getElementById('info').innerHTML = `
                        <strong>الاسم:</strong> ${student[1]}<br>
                        <strong>رقم الجلوس:</strong> ${student[0]}<br>
                        <strong>الإدارة/المدرسة:</strong> ${student[2] || ''} ${student[3] || ''}
                    `;
                    
                    let html = "";
                    for(let i = 4; i < headers.length; i++) {
                        if(headers[i]) {
                            html += `<tr><td><b>${headers[i]}</b></td><td>${student[i] || '0'}</td></tr>`;
                        }
                    }
                    document.getElementById('tableData').innerHTML = html;
                } else {
                    alert("⚠️ عذراً، رقم الجلوس (" + seat + ") غير مسجل حالياً.");
                }
            } catch(e) {
                loader.style.display = "none";
                alert("❌ فشل الاتصال بقاعدة البيانات. تأكد من نشر الشيت بصيغة CSV.");
            }
        }
    </script>
</body>
</html>
