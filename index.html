<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة نتائج مدرسة الظواهرية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; direction: rtl; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #1a5fb4, #000); color: white; padding: 30px 10px; text-align: center; border-bottom: 5px solid #d4af37; }
        .gift { color: #d4af37; font-weight: bold; margin-top: 10px; font-size: 18px; border: 1px dashed #d4af37; display: inline-block; padding: 5px 20px; border-radius: 50px; }
        .card { max-width: 500px; margin: -20px auto 40px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; position: relative; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #eee; transition: 0.3s; }
        .tab-btn.active { background: #1a5fb4; color: white; }
        input { width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; text-align: center; box-sizing: border-box; }
        button.search-btn { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
        #res { margin-top: 25px; display: none; text-align: right; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border-right: 5px solid #d4af37; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th { background: #1a5fb4; color: white; }
        .loader { display: none; margin: 20px 0; color: #1a5fb4; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>نتائج امتحانات 2026</h1>
    <div class="gift">إهداء من مدرسة الظواهرية للتعليم الأساسي 🏆</div>
</div>

<div class="card">
    <div class="tab-container">
        <button id="t1" class="tab-btn active" onclick="setMode(1)">صفوف النقل (الظواهرية)</button>
        <button id="t2" class="tab-btn" onclick="setMode(2)">الشهادة الإعدادية (الإدارة)</button>
    </div>

    <input type="text" id="seatInput" placeholder="أدخل رقم الجلوس هنا">
    <button class="search-btn" onclick="startSearch()">بحث عن النتيجة</button>
    
    <div id="loader" class="loader">🔍 جاري جلب البيانات من السجلات...</div>

    <div id="res">
        <div id="info" class="info-box"></div>
        <table>
            <thead><tr><th>المادة</th><th>الدرجة</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let mode = 1;
    // روابط الـ CSV المشفرة (تأكد من نشر الشيت كـ CSV)
    const linkNakl = 'aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vc3ByZWFkc2hlZXRzL2QvZS8yUEFDWC0xdlNiblVHUWJ5YjV3ek85bmlNQWpiWkwyeWxUMmMzQmhPc01fRkpZUVFnRGhNMHFxaTRFMGZYc3dmWnM1ZzlRV2tHTzdoZEtYQnQyUEJ2Wi9wdWI/Z2lkPTAmc2luZ2xlPXRydWUmb3V0cHV0PWNzdi';
    const linkShahada = 'aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vc3ByZWFkc2hlZXRzL2QvZS8yUEFDWC0xdlNiblVHUWJ5YjV3ek85bmlNQWpiWkwyeWxUMmMzQmhPc01fRkpZUVFnRGhNMHFxaTRFMGZYc3dmWnM1ZzlRV2tHTzdoZEtYQnQyUEJ2Wi9wdWI/Z2lkPTAmc2luZ2xlPXRydWUmb3V0cHV0PWNzdi';

    function setMode(m) {
        mode = m;
        document.getElementById('t1').className = m === 1 ? 'tab-btn active' : 'tab-btn';
        document.getElementById('t2').className = m === 2 ? 'tab-btn active' : 'tab-btn';
        document.getElementById('res').style.display = 'none';
        document.getElementById('seatInput').value = '';
    }

    async function startSearch() {
        const seat = document.getElementById('seatInput').value.trim();
        const loader = document.getElementById('loader');
        const resDiv = document.getElementById('res');

        if(!seat) return alert("يرجى إدخال رقم الجلوس");
        loader.style.display = "block";
        resDiv.style.display = "none";

        try {
            const url = mode === 1 ? atob(linkNakl) : atob(linkShahada);
            const response = await fetch(url);
            const text = await response.text();
            
            // تنظيف البيانات
            const cleanText = text.replace(/^\uFEFF/, "");
            const rows = cleanText.split('\n').filter(r => r.length > 0).map(r => r.split(',').map(c => c.trim()));
            const headers = rows[0];

            // البحث الذكي: يبحث عن رقم الجلوس في أول عمود (Index 0)
            const student = rows.find(r => r[0] == seat);

            loader.style.display = "none";

            if(student) {
                resDiv.style.display = "block";
                // الاسم في العمود الثاني (Index 1)
                document.getElementById('info').innerHTML = `
                    <strong>الاسم:</strong> ${student[1] || 'غير مسجل'}<br>
                    <strong>رقم الجلوس:</strong> ${student[0]}<br>
                    <strong>الحالة:</strong> ${mode === 1 ? 'صفوف النقل' : 'الشهادة الإعدادية'}
                `;
                
                let html = "";
                // عرض باقي الأعمدة كدرجات (من العمود الثالث Index 2)
                for(let i = 2; i < headers.length; i++) {
                    if(headers[i]) {
                        html += `<tr><td><b>${headers[i]}</b></td><td>${student[i] || '--'}</td></tr>`;
                    }
                }
                document.getElementById('tableBody').innerHTML = html;
            } else {
                alert("❌ رقم الجلوس (" + seat + ") غير موجود في قسم " + (mode === 1 ? "النقل" : "الشهادة") + ".");
            }
        } catch(e) {
            loader.style.display = "none";
            alert("⚠️ عذراً، حدث خطأ في تحميل البيانات. تأكد من اتصال الإنترنت.");
        }
    }
</script>
</body>
</html>
