<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; direction: rtl; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #2c3e50, #000000); color: white; padding: 40px 10px; text-align: center; border-bottom: 5px solid #d4af37; }
        .header h1 { margin: 0; font-size: 24px; }
        .header .gift { color: #d4af37; font-weight: bold; margin-top: 15px; font-size: 19px; border: 1px dashed #d4af37; display: inline-block; padding: 5px 20px; border-radius: 50px; }
        .card { max-width: 550px; margin: -25px auto 40px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; position: relative; z-index: 10; }
        .tab-btn { background: #f0f0f0; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px; color: #555; }
        .tab-btn.active { background: #1a5fb4; color: white; }
        input { width: 100%; padding: 15px; margin: 25px 0; border: 2px solid #eee; border-radius: 12px; font-size: 20px; text-align: center; box-sizing: border-box; }
        button.search-btn { background: #27ae60; color: white; border: none; padding: 16px; border-radius: 12px; cursor: pointer; font-size: 19px; font-weight: bold; width: 100%; }
        #res { margin-top: 30px; display: none; text-align: right; }
        .student-info { background: #f8f9fa; padding: 20px; border-radius: 15px; border-right: 8px solid #d4af37; margin-bottom: 25px; font-size: 19px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th, td { border: 1px solid #f0f0f0; padding: 14px; text-align: center; }
        th { background: #2c3e50; color: white; }
        .loader { display: none; color: #1a5fb4; font-weight: bold; margin: 20px 0; }
    </style>
</head>
