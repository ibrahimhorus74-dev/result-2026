<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الصف الأول الإعدادي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f3; direction: rtl; padding: 20px; margin: 0; }
        .header-school { color: #2c3e50; margin-bottom: 5px; font-size: 24px; font-weight: bold; }
        .header-title { color: #34495e; margin-bottom: 25px; font-size: 18px; border-bottom: 2px solid #3498db; display: inline-block; padding-bottom: 5px; }
        .card { max-width: 500px; margin: 20px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        input { width: 85%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; text-align: center; outline: none; }
        input:focus { border-color: #3498db; }
        button { background: #27ae60; color: white; border: none; padding: 12px 40px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #219150; transform: scale(1.05); }
        #res { margin-top: 25px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
        th { background-color: #3498db; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .student-info { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: right; border-right: 5px solid #3498db; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-school">مدرسة الظواهرية للتعليم الأساسي</div>
        <div class="header-title">نتيجة الصف الأول الإعدادي</div>
        
        <p>ادخل رقم الجلوس للاستعلام عن النتيجة</p>
        <input type="text" id="num" placeholder="رقم الجلوس">
        <br>
        <button onclick="search()">عرض النتيجة 🔎</button>
        
        <div id="res">
            <div id="studentData" class="student-info"></div>
            <table id="gradesTable">
                <thead>
                    <tr>
                        <th>المادة</th>
                        <th>الدرجة</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function search() {
            const val = document.getElementById('num').value.trim();
            const resDiv = document.getElementById('res');
            const tableBody = document.getElementById('tableBody');
            const studentData = document.getElementById('studentData');
            const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5D73qMZI-_z6xXKHlVD_JEgcdrp__GCy-zkXooalXq7YbiJTVCEjsLgt89q0L_A/pub?output=csv';
            
            if(!val) { alert("من فضلك اكتب رقم الجلوس أولاً"); return; }

            try {
                const resp = await fetch(url);
                const text = await resp.text();
                const rows = text.split('\n').map(r => r.split(','));
                const headers = rows[0]; 
                
                // البحث في أول 3 أعمدة (مسلسل، اسم، رقم جلوس)
                const student = rows.find(r => r[0] === val || r[1] === val || r[2] === val);

                if(student) {
                    resDiv.style.display = "block";
                    studentData.innerHTML = `<strong>الاسم:</strong> ${student[1]}<br><strong>رقم الجلوس:</strong> ${val}`;
                    
                    let tableContent = "";
                    // بيفترض إن الدرجات بتبدأ من العمود الرابع (index 3)
                    for(let i = 3; i < headers.length; i++) {
                        if(headers[i].trim() !== "" && student[i]) {
                            tableContent += `<tr><td>${headers[i]}</td><td><strong>${student[i]}</strong></td></tr>`;
                        }
                    }
                    tableBody.innerHTML = tableContent;
                } else {
                    alert("عفواً، رقم الجلوس هذا غير موجود!");
                    resDiv.style.display = "none";
                }
            } catch(e) { 
                alert("حدث خطأ في الاتصال بالبيانات، تأكد من إنترنت الموبايل."); 
            }
        }
    </script>
</body>
</html>
