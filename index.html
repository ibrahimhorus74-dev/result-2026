<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج مدرسة الظواهرية والشهادة الإعدادية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; direction: rtl; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #2c3e50, #000000); color: white; padding: 30px 10px; text-align: center; border-bottom: 5px solid #d4af37; }
        .header h1 { margin: 0; font-size: 22px; }
        .gift { color: #d4af37; font-weight: bold; margin-top: 10px; font-size: 17px; }
        .card { max-width: 500px; margin: -20px auto 40px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #eee; }
        .tab-btn.active { background: #1a5fb4; color: white; }
        input { width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 18px; text-align: center; box-sizing: border-box; }
        .search-btn { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
        #res { margin-top: 25px; display: none; text-align: right; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 10px; border-right: 5px solid #d4af37; margin-bottom: 20px; font-size: 17px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #2c3e50; color: white; }
        .loader { display: none; margin: 15px 0; color: #1a5fb4; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>نتيجة الشهادة الإعدادية - إدارة الحسينية</h1>
    <div class="gift">إهداء من مدرسة الظواهرية للتعليم الأساسي 🏆</div>
</div>

<div class="card">
    <div class="tabs">
        <button id="t1" class="tab-btn active" onclick="setMode(1)">صفوف النقل (الظواهرية)</button>
        <button id="t2" class="tab-btn" onclick="setMode(2)">الشهادة الإعدادية (الإدارة)</button>
    </div>

    <input type="text" id="seatInput" placeholder="أدخل رقم الجلوس هنا">
    <button class="search-btn" onclick="search()">عرض النتيجة</button>
    
    <div id="loader" class="loader">🔍 جاري البحث في السجلات...</div>

    <div id="res">
        <div id="info" class="info-box"></div>
        <table>
            <thead><tr><th>المادة</th><th>الدرجة</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let mode = 1;
    // روابط الـ CSV المشفرة (تأكد أنك قمت بنشر الشيت كـ CSV من Google Sheets)
    const linkShahada = 'aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vc3ByZWFkc2hlZXRzL2QvZS8yUEFDWC0xdlNiblVHUWJ5YjV3ek85bmlNQWpiWkwyeWxUMmMzQmhPc01fRkpZUVFnRGhNMHFxaTRFMGZYc3dmWnM1ZzlRV2tHTzdoZEtYQnQyUEJ2Wi9wdWI/Z2lkPTAmc2luZ2xlPXRydWUmb3V0cHV0PWNzdi';

    function setMode(m) {
        mode = m;
        document.getElementById('t1').className = m === 1 ? 'tab-btn active' : 'tab-btn';
        document.getElementById('t2').className = m === 2 ? 'tab-btn active' : 'tab-btn';
        document.getElementById('res').style.display = 'none';
    }

    async function search() {
        const seat = document.getElementById('seatInput').value.trim();
        const loader = document.getElementById('loader');
        const resDiv = document.getElementById('res');

        if(!seat) return alert("من فضلك اكتب رقم الجلوس");
        loader.style.display = "block";
        resDiv.style.display = "none";

        try {
            const resp = await fetch(atob(linkShahada));
            const text = await resp.text();
            
            // تنظيف الملف من الرموز المخفية وتقسيم السطور
            const cleanText = text.replace(/^\uFEFF/, "");
            const rows = cleanText.split('\n').filter(line => line.trim() !== "").map(r => r.split(',').map(c => c.trim()));
            const headers = rows[0];

            // بحث "ذكي": يدور في كل الأعمدة لو ملقاش في الأول
            const student = rows.find(r => r.some(cell => cell == seat));

            loader.style.display = "none";

            if(student) {
                resDiv.style.display = "block";
                // عرض البيانات: نفترض الاسم في العمود 2 (Index 1) والجلوس في العمود 1 (Index 0)
                document.getElementById('info').innerHTML = `
                    <strong>الاسم:</strong> ${student[1] || 'غير متوفر'}<br>
                    <strong>رقم الجلوس:</strong> ${seat}<br>
                    <strong>القسم:</strong> ${mode === 1 ? 'نقل' : 'شهادة إعدادية'}
                `;
                
                let html = "";
                // عرض الدرجات من العمود الثالث (Index 2) للنهاية
                for(let i = 2; i < headers.length; i++) {
                    if(headers[i]) {
                        html += `<tr><td><b>${headers[i]}</b></td><td>${student[i] || '0'}</td></tr>`;
                    }
                }
                document.getElementById('tableBody').innerHTML = html;
            } else {
                alert("⚠️ رقم الجلوس غير موجود في هذا القسم.");
            }
        } catch(e) {
            loader.style.display = "none";
            alert("❌ خطأ في تحميل البيانات. تأكد من نشر الشيت بصيغة CSV.");
        }
    }
</script>
</body>
</html>
